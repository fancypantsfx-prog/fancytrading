<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FancyPants</title>
        <style>
            :root {
                color-scheme: light dark;
            }

            body {
                margin: 0;
                background: Canvas;
            }

            main {
                display: grid;
                min-height: 100vh;
                min-height: 100dvh;
                place-items: center;
            }

            img {
                display: block;
                width: min(58vw, 20rem);
                height: auto;
            }
        </style>
    </head>
    <body>
        <main>
            <picture>
                <source media="(prefers-color-scheme: dark)" srcset="{root_url}brand/brand-logo-dark.svg" />
                <img src="{root_url}brand/brand-logo.svg" alt="FancyPants" width="64" height="64" />
            </picture>
        </main>
    </body>
</html>
