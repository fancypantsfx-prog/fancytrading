name = "fancytrading-strategy-finder"
main = "worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = false

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "FANCY_MARKET_DATA"
class_name = "FancyMarketData"

[[durable_objects.bindings]]
name = "FANCY_TRADING_ACCOUNT"
class_name = "FancyTradingAccount"

[[migrations]]
tag = "fancy-market-data-v1"
new_sqlite_classes = ["FancyMarketData", "FancyTradingAccount"]

# Add the same KV namespace as STRATEGY_FINDER_CACHE in the Pages project.
[[kv_namespaces]]
binding = "STRATEGY_FINDER_CACHE"
id = "63a41858bfa34eb1b3a921c5f1c4243d"
